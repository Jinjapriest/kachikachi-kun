<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>カチカチくん 設定推測</title>
<meta name="theme-color" content="#d4173a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* VOICE everyday tool for the hall floor: quick, legible, thumb-sized
   IDEA the cabinet's data panel: a lit header strip in the machine's own red, counters like hardware buttons
   PICTURE live posterior bars per setting, drawn large inside the red strip, redrawn on every tap
   COLOUR hibiscus red field, white ground, palm green support, lamp-yellow accent on the leading setting
   TYPE Zen Kaku Gothic New for text, Barlow Condensed for every number
   LAYOUT one screen, no page scroll: red result strip, data inputs, counter pad filling the rest, tool row, bottom tabs */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121413);--ink:light-dark(#16110f,#f2efe9);--sub:light-dark(#6a625d,#a9a39b);--line:light-dark(#e6e1dc,#2c302d);--card:light-dark(#f6f3ef,#1b1e1c);--red:light-dark(#d4173a,#a8132f);--red2:light-dark(#b40f2e,#7e0c22);--green:light-dark(#0c6b49,#3fb886);--yel:#ffd21f;--on:#fff}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body,button,input,select,textarea,label,a{touch-action:manipulation}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.num{font-family:"Barlow Condensed","Zen Kaku Gothic New",sans-serif;font-variant-numeric:tabular-nums}
.app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:max(14px,env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
html,body{overscroll-behavior:none}
.res{background:var(--red);color:var(--on);padding:max(8px,env(safe-area-inset-top,0px)) 12px 8px;flex:none}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 5em 44px;gap:6px}
.row2 button{min-height:40px;background:var(--yel);color:#16110f;border:0;font-size:22px;font-weight:900;padding:0}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.sheet.open{display:flex}
.sheet header{background:var(--red);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet header b{font-size:18px}
.sheet header button{background:var(--red2);color:#fff;border:0}
.sbody{flex:1;overflow:auto;padding:12px;max-width:640px;width:100%;margin:0 auto}
.sbody label{display:block;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:10px}
.sbody input,.sbody select,.sbody textarea{display:block;width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);margin-top:4px}
.sbody textarea{min-height:110px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.prim{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.msg{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--card);margin:8px 0}
.msg.warn{background:color-mix(in srgb,var(--yel) 35%,var(--bg))}
.res select,.res input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:0;border-radius:9px;padding:6px 8px;min-height:40px;width:100%}
.mid{display:grid;grid-template-columns:minmax(0,1fr) 7.2em;gap:10px;align-items:end;margin-top:6px}
.bars{display:grid;gap:4px;height:clamp(70px,13vh,130px);align-items:end}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar i{display:block;width:100%;background:color-mix(in srgb,#fff 80%,transparent);border-radius:5px 5px 2px 2px;transition:height .25s ease}
.bar.top i{background:var(--yel)}
.bar b{font-size:15px;line-height:1;margin-bottom:2px;white-space:nowrap}
.bar span{font-size:13px;margin-top:3px;font-weight:700;line-height:1}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
.figs{display:grid;gap:4px}
.figs div{background:var(--red2);border-radius:8px;padding:3px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.figs small{font-size:13px;opacity:.9;white-space:nowrap}
.figs strong{font-size:22px;line-height:1.15;white-space:nowrap}
.note{font-size:13px;opacity:.92;margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inputs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px 12px 0;flex:none}
.inputs label{display:block;font-size:13px;font-weight:700;color:var(--sub);line-height:1.2}
.inputs input{width:100%;font-size:20px;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:4px 8px;background:var(--bg);color:var(--ink)}
.view{flex:1 1 0;min-height:0;padding:8px 12px;display:none}
.view.act{display:flex;flex-direction:column}
.view.sc{overflow:auto}
.pad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:8px}
.k{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:8px 10px;text-align:left;border-radius:14px;user-select:none;min-height:0;height:100%}
.k:active{transform:translateY(2px)}
.k em{font-style:normal;font-size:14px;font-weight:700;line-height:1.2}
.k .num{font-size:clamp(28px,6vh,48px);line-height:1;align-self:flex-end}
.k.bb{background:var(--red);color:var(--on);border-color:var(--red)}
.k.rb{background:var(--green);color:#fff;border-color:var(--green)}
.k.yl{background:var(--yel);color:#16110f;border-color:var(--yel)}
.k.bl{background:#2f6fe0;color:#fff;border-color:#2f6fe0}
.k.gr{background:color-mix(in srgb,var(--green) 14%,var(--bg))}
button{font:inherit;font-size:14px;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.minus-on .pad button.k,.minus-on .chips button{box-shadow:inset 0 0 0 3px var(--red)}
.tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px 12px 4px;flex:none}
.tools button{min-height:48px}
.tools button{padding:0 2px;white-space:nowrap}
.seg{display:none;grid-template-columns:1fr 1fr;gap:0;margin:8px 12px 0;border:2px solid var(--red);border-radius:12px;overflow:hidden;flex:none}
.seg.show{display:grid}
.seg button{border:0;border-radius:0;min-height:48px;font-size:16px;font-weight:700;background:var(--bg);color:var(--red)}
.seg button.act{background:var(--red);color:#fff}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-top:1px solid var(--line);margin-top:8px;flex:none}
.tabs button{border:0;border-radius:0;background:none;min-height:54px;font-size:14px;padding:0 2px;font-weight:700;color:var(--sub);border-top:3px solid transparent}
.tabs button.act{color:var(--red);border-top-color:var(--red)}
.chipbox{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:4px 0 8px}
.chips button{padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;font-size:14px}
.chips .num{font-size:26px;line-height:1}
.c0{border-bottom:5px solid #2f6fe0!important}.c1{border-bottom:5px solid #f2c200!important}.c2{border-bottom:5px solid #20a35a!important}.c3{border-bottom:5px solid #e0243c!important}.c4{border-bottom:5px solid transparent!important;border-image:linear-gradient(90deg,#e0243c,#f2c200,#20a35a,#2f6fe0,#9b4be0) 1!important}
.judge{font-size:14px;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.judge div{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:8px;padding:4px 0}
.judge b{font-size:13px;color:var(--sub)}
.dmm{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:8px 12px;margin-bottom:10px;border-radius:12px;background:color-mix(in srgb,var(--red) 10%,var(--bg));border:1px solid color-mix(in srgb,var(--red) 35%,var(--bg));color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.links .dmm{margin:0;flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.dmm small{color:var(--sub);font-weight:500;font-size:13px}
.lbl{font-size:14px;font-weight:700;color:var(--sub)}
h3{font-size:16px;margin:4px 0 6px}
.cf{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--sub);font-weight:700}
td.hit{background:color-mix(in srgb,var(--yel) 40%,transparent);font-weight:700}
.ed td{padding:3px 2px}.ed input{width:100%;font-size:16px;min-height:38px;text-align:right;padding:4px;min-width:4.2em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.it{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 44px;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.it input,.it select{font:inherit;font-size:16px;min-height:42px;border:1px solid var(--line);border-radius:9px;padding:4px 8px;background:var(--bg);color:var(--ink);width:100%}
.it .r2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:6px}
.it button{padding:0}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:15px}
.chk input{width:22px;height:22px}
.hist ul{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hist small{color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app" id="app">
<section class="res">
<div class="row2">
<select id="model" aria-label="機種"></select>
<input id="tag" placeholder="台番号" inputmode="numeric" aria-label="台番号">
<button id="addBtn" aria-label="機種を追加">＋</button>
</div>
<div class="mid">
<div class="bars" id="bars"></div>
<div class="figs">
<div><small>最有力</small><strong class="num" id="fTop">-</strong></div>
<div><small id="fHiL">4以上</small><strong class="num" id="fHi">-</strong></div>
<div><small>機械割</small><strong class="num" id="fRate">-</strong></div>
</div>
</div>
<p class="note" id="basis"></p>
</section>
<div class="inputs">
<label>総G<input id="g" class="num" type="number" inputmode="numeric" min="0"></label>
<label>BIG<input id="big" class="num" type="number" inputmode="numeric" min="0"></label>
<label>REG<input id="reg" class="num" type="number" inputmode="numeric" min="0"></label>
<label>開始G<input id="g0" class="num" type="number" inputmode="numeric" min="0"></label>
</div>
<div class="seg" id="seg"><button data-v="count">カウント</button><button data-v="lamp">ランプ</button></div>
<div class="view act" id="v-count"><div class="pad" id="pad"></div></div>
<div class="view sc" id="v-lamp"><div class="chipbox" id="lamps"></div></div>
<div class="view sc" id="v-stat">
<div class="links"><a class="dmm" id="dmm1" target="_blank" rel="noopener"></a><a class="dmm" id="igk1" target="_blank" rel="noopener"></a></div>
<h3>確定演出で絞り込み</h3><div class="cf" id="conf"></div>
<h3>実測と設定差</h3><div class="scroll"><table id="stat"></table></div>
<div class="judge" id="lampJ"></div>
<p class="muted" id="ownG"></p>
</div>
<div class="view sc" id="v-spec">
<div class="links"><a class="dmm" id="dmm2" target="_blank" rel="noopener"></a><a class="dmm" id="igk2" target="_blank" rel="noopener"></a></div>
<p class="muted" id="specNote" style="margin-top:0"></p>
<div class="scroll"><table class="ed" id="spec"></table></div>
<p><button id="specReset">この機種の数値を初期値に戻す</button> <button id="delModel" hidden>この追加機種を削除</button></p>
<p class="muted">数値は解析サイトの公表値・調査値（ガリぞう氏調べ等）。小役は推定値を含むため目安です。</p>
</div>
<div class="view sc" id="v-items">
<h3>カウンターのモード</h3>
<div class="modes" id="modes"></div>
<p class="muted" id="modeNote" style="margin:0 0 8px"></p>
<div id="itemEd"></div>
</div>
<div class="view sc hist" id="v-hist">
<p style="margin-top:0"><button id="copy">今の結果をコピー</button></p>
<ul id="hist"></ul>
</div>
<div class="tools">
<button id="minus" aria-pressed="false">−モード</button>
<button id="undo">戻す</button>
<button id="startNow">開始=今</button>
<button id="save">保存</button>
<button id="reset">新しい台</button>
</div>
<nav class="tabs" id="tabs"></nav>
</div>
<div class="sheet" id="sheet" role="dialog" aria-label="機種を追加">
<header><b>機種を追加</b><button id="shClose">閉じる</button></header>
<div class="sbody">
<div class="grid2">
<label>機種名<input id="nName" placeholder="例：スマスロ ハナハナ"></label>
<label>タイプ<select id="nFam"><option value="j">ジャグラー系</option><option value="h">ハナハナ系</option></select></label>
</div>
<label>解析サイトの表を貼り付け（推奨）<textarea id="nPaste" placeholder="解析サイトのボーナス確率・ブドウ確率などの表をコピーして貼り付け"></textarea></label>
<div class="btnrow" style="display:flex;gap:8px;flex-wrap:wrap"><button class="prim" id="nRead">貼り付けから読み取る</button><button id="nAsk">機種名からAIで調べる</button></div>
<div class="msg" id="nMsg">解析サイト（ちょんぼりすた、1geki、パチ7など）の表を貼り付けると、その数字をそのまま読み取ります。貼り付けなしで「機種名からAIで調べる」も使えますが、AIの知識（2026年6月まで）による推定なので、必ず数字を確かめてください。</div>
<div id="nPrev"></div>
</div>
</div>
<div class="toast" id="toast"></div>

function regexParse(txt,fam){const rows=[];for(const line of txt.split(/\n/)){const m=line.match(/設定\s*([1-6V])|^\s*([1-6V])\s/);const fr=[...line.matchAll(/1\s*\/\s*([0-9]+(?:\.[0-9]+)?)/g)].map(x=>+x[1]);const pc=[...line.matchAll(/([0-9]{2,3}(?:\.[0-9]+)?)\s*%/g)].map(x=>+x[1]);if(m&&fr.length>=2)rows.push({s:m[1]||m[2],fr,pc})}
const seen=new Map();rows.forEach(r=>{if(!seen.has(r.s))seen.set(r.s,r)});const rs=[...seen.values()];if(rs.length<4)return null;
return{sets:rs.map(r=>r.s),big:rs.map(r=>r.fr[0]),reg:rs.map(r=>r.fr[1]),rate:rs.every(r=>r.pc.length)?rs.map(r=>r.pc[r.pc.length-1]):null,family:fam}}
const PROMPT=(name,fam,txt)=>`あなたはパチスロのスペック表を構造化するアシスタントです。対象機種:「${name||'不明'}」(${fam==='h'?'ハナハナ系(沖スロ)':'ジャグラー系'})。
${txt?'以下の貼り付けテキストに書かれている数値だけを使ってください。書かれていない項目はnullにし、推測で埋めないこと。\n---\n'+txt.slice(0,6000)+'\n---':'あなたの知識にある公表値・解析値を答えてください。知らない機種や自信のない項目はnullにし、作り話をしないこと。'}
次のJSONだけを返してください（説明文なし）:
{"name":機種名,"sets":["1","2",...設定ラベル],"big":[BIG確率の分母...],"reg":[REG確率の分母...],"rate":[機械割%...]またはnull,"grape":[ブドウ分母]またはnull,"cherry":[非重複チェリー分母]またはnull,"bell":[ベル分母]またはnull,"suika":[BIG中スイカ分母]またはnull,"sreg":[単独REG分母]またはnull,"creg":[チェリー重複REG分母]またはnull,"known":true/false(この機種を知っているか),"note":"出典や注意を一文"}
分母は数値（1/273.1なら273.1）。配列の長さはsetsと同じにすること。`;
async function aiRead(useText){const name=$('nName').value.trim(),fam=$('nFam').value,txt=useText?$('nPaste').value.trim():'';

say(useText?'読み取り中…':'AIに問い合わせ中…');
try{const r=await sp.json(PROMPT(name,fam,txt),{modelTier:'default'});if(!r||(!useText&&r.known===false))return say('AIはこの機種のデータを持っていないようです。解析サイトの表を貼り付けてください',true);r.family=fam;if(!r.name)r.name=name;preview(r,useText?'貼り付けから読み取り':'AIの知識による推定（要確認）')}
catch(e){if(useText){const r=regexParse(txt,fam);if(r){r.name=name;return preview(r,'貼り付けから読み取り（簡易解析）')}}say(e&&e.code==='rate_limited'?'混み合っています。少し待ってからもう一度':'読み取りに失敗しました',true)}}
function preview(r,src){const sets=(Array.isArray(r.sets)&&r.sets.length>=2?r.sets:S6).map(String).slice(0,6),L=sets.length;
const d={id:'c'+Date.now(),f:r.family==='h'?H:J,n:String(r.name||'追加機種').slice(0,40),sets,big:N(r.big),reg:N(r.reg),rate:N(r.rate),note:src+(r.note?'：'+String(r.note).slice(0,80):'')};
for(const k of['grape','cherry','bell','suika','sreg','creg']){const a=N(r[k]);if(okArr(a,L))d[k]=a}
if(d.rate&&!(d.rate.length===L&&d.rate.every(v=>v>50&&v<150)))delete d.rate;
